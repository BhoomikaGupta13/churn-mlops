data:
  raw_path: data/raw/telco_churn.csv
  batches_dir: data/batches
  reference_path: data/batches/reference.csv
  latest_path: data/batches/latest.csv
  processed_dir: data/processed
  test_size: 0.2
  random_state: 42

ingest:
  reference_fraction: 0.6
  n_batches: 4

validate:
  max_null_rate: 0.05

train:
  model_type: random_forest        # or logistic_regression
  random_forest:
    n_estimators: 200
    max_depth: 10
    min_samples_leaf: 5
    class_weight: balanced
  logistic_regression:
    C: 1.0
    max_iter: 500
    class_weight: balanced

promotion:                          # used in Milestone 5
  primary_metric: f1
  min_improvement: 0.01
  min_absolute_f1: 0.55

mlflow:
  tracking_uri: http://127.0.0.1:5000
  experiment_name: churn-prediction
  registered_model_name: churn-classifier

drift:
  share_drifted_features_threshold: 0.2   # retrain if >= 20% of features drifted
  output_dir: data/monitoring

retrain:
  new_data_eval_fraction: 0.5             # half of the new batch is held out for evaluation